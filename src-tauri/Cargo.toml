[package]
name = "editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8"
