[package]
name = "textflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "textflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-window-state = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSControl", "NSPanel", "NSPopUpButton", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSSavePanel", "NSText", "NSTextField", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSObject", "NSString", "NSURL"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "PDFDocument", "PDFPage"] }
block2 = "0.6"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5"
