# Builds the Windows installers, unsigned, as workflow artifacts (no release): the .msi and the
# NSIS .exe. Started by hand only: Actions → Build Windows → Run workflow. The installers are under
# the run's Artifacts, as a zip (docs/decisions.md, Desktop app). macOS: build-macos.yml.

name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Git on Windows turns LF into CRLF on checkout by default; the tests need the files as committed
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      - run: cargo test
        working-directory: src-tauri

      - uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npx tauri

      - uses: actions/upload-artifact@v5
        with:
          name: textflow-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
